<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>De Reiger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500;75..100,800&family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
/* Layout: links een nagebootste telefoon (het speelveld), rechts het recherchedossier; op mobiel wordt het dossier een uitschuifpaneel. */
:root{
  --bg:#D9E0E6; --panel:#F4F6F8; --ink:#142033; --muted:#596577; --line:#C2CBD5;
  --accent:#A86F08; --accent-soft:#F3E3C2; --stamp:#B3261E; --ok:#2B7A4D;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1220; --panel:#151D2D; --ink:#E2E8F0; --muted:#97A3B6; --line:#2A3549;
  --accent:#E3A93E; --accent-soft:#3A2E17; --stamp:#F06B61; --ok:#5EC08B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1220; --panel:#151D2D; --ink:#E2E8F0; --muted:#97A3B6; --line:#2A3549;
  --accent:#E3A93E; --accent-soft:#3A2E17; --stamp:#F06B61; --ok:#5EC08B; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.layout{min-height:100%;display:grid;grid-template-columns:390px minmax(0,440px);gap:40px;justify-content:center;align-items:start;
  padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Telefoon (eigen, vaste look: dit is een apparaat) ---------- */
.phone{width:390px;max-width:100%;height:min(812px,calc(100dvh - 56px));min-height:600px;background:#0b0b0d;border-radius:52px;padding:12px;
  box-shadow:0 0 0 2px #2b2b30,0 30px 60px -20px rgba(0,0,0,.45);position:sticky;top:28px}
.screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#f2f2f7;color:#111;font-family:var(--f-ui);font-size:15px;line-height:1.35;display:flex;flex-direction:column}
.sbar{position:absolute;inset:0 0 auto;height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:600;font-size:14px;z-index:5;pointer-events:none}
.sbar.light{color:#fff}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#000;z-index:6}
.homebar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:rgba(0,0,0,.75);border:0;padding:0;z-index:8}
.homebar.light{background:rgba(255,255,255,.85)}
.homebar::after{content:"";position:absolute;inset:-10px -10px}

/* vergrendelscherm */
.lock{position:absolute;inset:0;color:#fff;display:flex;flex-direction:column;align-items:center}
.lock .wall{position:absolute;inset:0}
.lock .wall svg{width:100%;height:100%;display:block}
.lock .veil{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,0) 40%,rgba(0,0,0,.55))}
.lock>*:not(.wall):not(.veil){position:relative}
.ldate{margin-top:62px;font-size:17px;font-weight:500;opacity:.9}
.ltime{font-size:84px;font-weight:600;letter-spacing:-2px;line-height:1}
.notifs{width:calc(100% - 24px);display:grid;gap:8px;margin-top:18px}
.notif{background:rgba(245,245,250,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#111;border-radius:18px;padding:10px 14px;font-size:14px}
.notif b{display:flex;justify-content:space-between;font-size:13px}
.notif b small{font-weight:400;color:#555}
.notif p{margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lockbottom{margin-top:auto;margin-bottom:26px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.dots{display:flex;gap:14px;margin-bottom:4px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.dots i.f{background:#fff}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:12px 22px}
.pad button{width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:26px;font-family:var(--f-ui)}
.pad button.txt{background:none;font-size:15px}
.lockhint{font-size:13px;opacity:.9;display:flex;gap:10px;align-items:center}
.lockhint button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:14px;padding:4px 10px;font-size:12px;font-family:var(--f-ui)}

/* beginscherm */
.home{position:absolute;inset:0;background:linear-gradient(160deg,#25324a,#0e1626 55%,#3b2a1a);padding:64px 18px 0;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.ico{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font-size:11.5px;font-family:var(--f-ui)}
.ico span.i{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;font-size:29px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ico .badge{position:absolute;top:-6px;right:-6px;background:#ff3b30;color:#fff;font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 5px}
.cal{background:#fff;color:#111;flex-direction:column;line-height:1}
.cal small{color:#ff3b30;font-size:10px;font-weight:600}
.cal b{font-size:26px;font-weight:400}

/* apps */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:#f2f2f7}
.ah{padding:50px 12px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(249,249,251,.95);border-bottom:1px solid #d9d9de;min-height:92px}
.ah .back{border:0;background:none;color:#0a7aff;font-size:16px;justify-self:start;padding:6px 4px;font-family:var(--f-ui)}
.ah b{font-size:16px;text-align:center}
.ah .big{grid-column:1/-1;font-size:30px;font-weight:700;padding:2px 6px 0}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:30px}
.list{background:#fff;margin:14px 14px 0;border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid #e7e7ec;font-family:var(--f-ui);font-size:15px;color:#111}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .sub{color:#6b6b72;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:#8e8e93;font-size:13px;white-space:nowrap}
.row .chev{color:#c4c4c8}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.unread{width:9px;height:9px;border-radius:50%;background:#0a7aff;flex:none}
.sect{margin:18px 28px 6px;color:#6b6b72;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.note{margin:8px 28px;color:#8e8e93;font-size:12.5px}

/* chat */
.chat{padding:10px 12px 30px;display:flex;flex-direction:column;gap:4px;background:#fff;min-height:100%}
.day{align-self:center;color:#8e8e93;font-size:12px;margin:12px 0 4px}
.msg{max-width:78%;display:flex;align-items:flex-end;gap:6px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:8px 12px;border-radius:18px;background:#e9e9eb;color:#111;font-size:15px;position:relative}
.msg.me .bub{background:#0a7aff;color:#fff}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.bub .who{display:block;font-size:11.5px;font-weight:600;color:#7a4fd0;margin-bottom:1px}
.bub.del{background:none;border:1px solid #d0d0d5;color:#8e8e93;font-style:italic}
.msg.me .bub.del{background:none;color:#8e8e93}

/* vastpinnen */
.pin{border:0;background:none;font-size:15px;opacity:.35;padding:4px;filter:grayscale(1);flex:none;line-height:1}
.pin.on{opacity:1;filter:none}
.pin:hover{opacity:.8}

/* mail */
.mailv{background:#fff;min-height:100%;padding:16px 18px 30px}
.mailv h3{margin:0 0 10px;font-size:20px}
.mailv .from{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:14px}
.mailv .from small{color:#8e8e93;display:block}
.mailv p{margin:0 0 12px;font-size:15.5px;line-height:1.45}
.attach{border:1px solid #e0e0e5;border-radius:12px;padding:12px 14px;background:#fafafc;font-size:14px}
.attach h4{margin:0 0 6px;font-size:14px}
.status{color:#2b8a3e;font-size:13px;margin-top:6px}

/* foto's */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#fff}
.pgrid button{border:0;padding:0;aspect-ratio:1;overflow:hidden;background:#ddd;display:block}
.pgrid svg{width:100%;height:100%;display:block}
.viewer{position:absolute;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;color:#fff}
.viewer .vh{padding:50px 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.viewer .vh button{border:0;background:none;color:#4da3ff;font-size:16px;font-family:var(--f-ui)}
.viewer .vh div{text-align:center;font-size:13px;line-height:1.3}
.viewer .vh small{color:#aaa}
.zoomwrap{flex:1;overflow:hidden;display:grid;place-items:center;cursor:zoom-in;touch-action:manipulation}
.zoomwrap.z{cursor:zoom-out}
.zoomwrap .img{width:100%;transition:transform .3s ease}
.zoomwrap .img svg{width:100%;height:auto;display:block}
.vfoot{padding:10px 16px 28px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#ccc;gap:10px}
.vfoot .pin{font-size:20px;filter:grayscale(1) brightness(2)}
.vfoot .pin.on{filter:none}

/* overige app-onderdelen */
.card{background:#fff;margin:14px;border-radius:14px;padding:14px}
.card h4{margin:0 0 4px;font-size:15px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee;font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv .t{font-variant-numeric:tabular-nums;color:#6b6b72;font-size:13.5px;flex:none;width:44px}
.kv .grow{flex:1;min-width:0}
.warn{color:#d70015}
.thumb{width:64px;height:40px;border-radius:6px;overflow:hidden;border:0;padding:0;flex:none}
.thumb svg{width:100%;height:100%;display:block}
.memo{display:flex;gap:12px;align-items:flex-start}
.play{width:36px;height:36px;border-radius:50%;border:0;background:#ff3b30;color:#fff;font-size:14px;flex:none}
.transcript{margin-top:8px;font-size:14px;color:#333;background:#f5f5f7;border-radius:10px;padding:8px 10px;font-style:italic}
.post{background:#fff;margin-bottom:10px}
.post .ph{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px;font-weight:600}
.post .ph small{font-weight:400;color:#8e8e93;margin-left:auto}
.post .pimg{border:0;padding:0;width:100%;display:block;background:#000}
.post .pimg svg{width:100%;display:block}
.post .cap{padding:8px 12px 12px;font-size:14px;display:flex;gap:6px;align-items:flex-start}
.post .cap span{flex:1}
.ring{padding:2px;border-radius:50%;background:linear-gradient(45deg,#f9a13a,#e1306c,#8a3ab9)}
.ring .av{border:2px solid #fff;width:36px;height:36px;font-size:13px}

/* ---------- Dossier (thema-bewust) ---------- */
.dossier{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:22px;min-width:0}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.case{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:600}
.dh h1{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:44px;line-height:.95;margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em}
.score{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.score span{font-size:28px;font-weight:600;display:block;line-height:1}
.score small{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.dossier h2{font-family:var(--f-display);font-stretch:75%;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:15px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.dossier h2 .n{font-family:var(--f-mono);font-size:11px;background:var(--ink);color:var(--panel);padding:1px 7px;border-radius:10px;letter-spacing:0}
details.brief summary{font-family:var(--f-display);font-stretch:75%;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.brief summary::-webkit-details-marker{display:none}
details.brief summary::after{content:"+";font-family:var(--f-mono)}
details.brief[open] summary::after{content:"–"}
.brief p{margin:10px 0 0;max-width:62ch}
.suspects{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sus{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:14px;line-height:1.35}
.sus b{font-family:var(--f-display);font-stretch:85%;font-size:15px;display:block}
.sus span{color:var(--muted)}

.tasks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.task{border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px}
.task .num{font-family:var(--f-mono);font-size:12px;font-weight:600;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
.task.done .num{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.task.locked{opacity:.5}
.task.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.task .q{font-weight:400;margin:2px 0 0}
.task .res{grid-column:2;font-size:14.5px;color:var(--muted);margin:0}
.task .act{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.task input{font-family:var(--f-mono);font-size:16px;width:110px;padding:7px 10px;border:1.5px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--panel);padding:7px 14px;border-radius:4px;font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:none;color:var(--ink)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{grid-column:2;font-size:14.5px;background:var(--accent-soft);border-left:3px solid var(--accent);padding:7px 10px;margin:8px 0 0}
.fb{grid-column:2;font-size:14px;color:var(--stamp);margin:6px 0 0}
.choice{display:flex;gap:8px;flex-wrap:wrap}

.pins{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pins li{display:flex;gap:10px;align-items:baseline;font-size:14.5px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.pins .tag{font-family:var(--f-mono);font-size:11px;font-weight:600;background:var(--accent);color:var(--panel);padding:1px 6px;border-radius:2px;flex:none}
.pins .txt{flex:1;min-width:0}
.pins button{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.empty{color:var(--muted);font-size:14.5px;font-style:italic;margin:0}

.report fieldset{border:0;padding:0;margin:0 0 14px}
.report legend{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:15px;line-height:1.35;cursor:pointer}
.opt input{margin-top:3px;accent-color:var(--accent);flex:none}
.confirm{border:2px solid var(--stamp);padding:12px;border-radius:4px;margin-top:6px}
.confirm p{margin:0 0 10px}
.locked-note{color:var(--muted);font-size:14.5px;margin:0}
.foot{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.foot small{color:var(--muted);font-size:12.5px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}

/* modals */
.modal{position:fixed;inset:0;background:rgba(8,12,20,.6);display:grid;place-items:center;z-index:50;padding-block:max(16px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);color:var(--ink);max-width:560px;width:100%;max-height:100%;overflow-y:auto;border-radius:6px;padding:26px 24px}
.sheet h2{font-family:var(--f-display);font-stretch:75%;font-weight:800;text-transform:uppercase;font-size:40px;line-height:.95;margin:4px 0 12px;text-wrap:balance}
.sheet p{margin:0 0 12px}
.stamp{display:inline-block;font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--stamp);border:3px solid var(--stamp);padding:2px 12px;transform:rotate(-4deg);margin:4px 0 12px}
.stamp.ok{color:var(--ok);border-color:var(--ok)}
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.verdict div{border:1px solid var(--line);border-radius:4px;padding:8px;text-align:center;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.verdict b{display:block;font-size:20px;margin-top:2px}
.share{font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;background:var(--bg);border-radius:4px;padding:10px 12px;margin:0 0 10px;user-select:all}
.chain{margin:0 0 14px;padding-left:20px;font-size:15px}
.chain li{margin-bottom:5px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:4px;font-size:14.5px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.dbtn{display:none}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);justify-items:center;padding-block:12px 84px}
  .phone{position:relative;top:0;height:min(780px,calc(100dvh - 100px));min-height:560px}
  .dossier{position:fixed;inset:auto 0 0 0;max-height:86dvh;overflow-y:auto;z-index:40;border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .3s ease;
    padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  body.dopen .dossier{transform:none;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
  .dbtn{display:flex;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;gap:8px;align-items:center;
    border:0;background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:30px;font-family:var(--f-display);font-stretch:85%;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .dbtn small{font-family:var(--f-mono);font-weight:400;opacity:.8}
  .close-d{display:inline-flex!important}
}
@media (max-width:440px){

function renderPhone(){
  const el=document.getElementById('screen');
  const top=S.stack[S.stack.length-1];
  const dark=!S.unlocked||!top;
  let h=statusbar(dark && !viewer || !!viewer);
  if(!S.unlocked) h+=lockScreen();
  else if(!top) h+=homeScreen();
  else h+=`<div class="app">${appScreen(top)}</div>`;
  if(viewer) h+=viewerHTML();
  h+=`<button class="homebar ${dark||viewer?'light':''}" data-act="home" aria-label="Naar beginscherm"></button>`;
  const prevBody=el.querySelector('.body'); const sc=prevBody?prevBody.scrollTop:0; const prevKey=el.dataset.k;
  el.innerHTML=h;
  const k=JSON.stringify(top||{})+(S.unlocked?1:0);
  if(prevKey===k){const b=el.querySelector('.body'); if(b) b.scrollTop=sc}
  el.dataset.k=k;
}

function taskHTML(t){
  const done=S.step>t.id, active=S.step===t.id, cls=done?'done':active?'active':'locked';
  let h=`<li class="task ${cls}"><span class="num">${done?'✓':t.id}</span><p class="q">${active||done?t.q:'Vergrendeld'}</p>`;
  if(done) h+=`<p class="res">${t.done}</p>`;
  if(active){
    if(t.type==='auto') h+=`<p class="res">Vind de pincode van vier cijfers en voer die in op de telefoon.</p>`;
    else if(t.type==='choice') h+=`<div class="act choice">${t.opts.map(o=>`<button class="btn ghost" data-act="answer" data-id="${t.id}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>`;
    else h+=`<div class="act"><input id="ans-${t.id}" inputmode="numeric" autocomplete="off" placeholder="${t.ph}" aria-label="Antwoord opdracht ${t.id}"><button class="btn" data-act="answer" data-id="${t.id}">Controleer</button></div>`;
    if(fb[t.id]) h+=`<p class="fb">${fb[t.id]}</p>`;
    if(S.hints.includes(t.id)) h+=`<p class="hint">${t.hint}</p>`;
    else h+=`<div class="act"><button class="linkbtn" data-act="hint" data-id="${t.id}">Hint gebruiken (−10 punten)</button></div>`;
  }
  return h+'</li>';
}
function reportHTML(){
  if(S.step<6) return `<p class="locked-note">Rond eerst de vijf opdrachten af. Daarna kun je je beschuldiging indienen.</p>`;
  if(S.report) return `<p>Je rapport is ingediend. ${S.report.wie?'De zaak is opgelost.':'De dader is nog vrij.'}</p><div class="row-btns"><button class="btn" data-act="showresult">Bekijk uitslag</button></div>`;
  const d=draft||{};
  const grp=(k,l)=>`<fieldset><legend>${l}</legend>${Q[k].map(o=>`<label class="opt"><input type="radio" name="${k}" value="${o[0]}" ${d[k]===o[0]?'checked':''}>${o[1]}</label>`).join('')}</fieldset>`;
  const pins=S.pins.length?S.pins.map(id=>`<label class="opt"><input type="checkbox" name="bewijs" value="${id}" ${(d.bewijs||[]).includes(id)?'checked':''}>${esc(EV[id].l)}</label>`).join(''):`<p class="empty">Je hebt nog geen bewijs vastgepind. Gebruik 📌 op de telefoon.</p>`;
  let h=`<form class="report" id="reportform">${grp('wie','Wie is de dader?')}${grp('hoe','Hoe is Ruben om het leven gekomen?')}${grp('waarom','Waarom?')}
   <fieldset><legend>Onderbouwing: kies precies 3 gepinde bewijzen</legend>${pins}</fieldset>`;
  if(confirmArm) h+=`<div class="confirm"><p>Je hebt één poging. Weet je het zeker?</p><div class="row-btns"><button type="button" class="btn" data-act="submitreport">Ja, dien in</button><button type="button" class="btn ghost" data-act="cancelreport">Nog even kijken</button></div></div>`;
  else h+=`<button type="button" class="btn" data-act="armreport">Beschuldiging indienen</button>`;
  if(fb.report) h+=`<p class="fb" style="margin-top:8px">${fb.report}</p>`;
  return h+'</form>';
}
function renderDossier(){
  const d=document.getElementById('dossier');
  const sc=d.scrollTop;
  d.innerHTML=`
  <header class="dh"><div><div class="case">ZAAK #001 · HAARLEM</div><h1>De Reiger</h1></div>
   <div class="score"><span>${score()}</span><small>punten</small><br><button class="linkbtn close-d" data-act="toggleD" style="margin-top:6px">Sluiten ✕</button></div></header>
  <details class="brief" ${S.step<=2?'open':''}><summary>Briefing</summary>
   <p>Vrijdagochtend 07:40 vond de schoonmaakster galeriehouder <b>Ruben Aldering (58)</b> dood onder aan de wenteltrap in zijn galerie aan het Spaarne. Het lijkt een val, maar de patholoog vond <b>één ronde slag op het achterhoofd, met bronsdeeltjes in de wond</b>. Op het bureau stonden twee whiskyglazen, en één ervan was schoongeveegd.</p>
   <p>Rubens telefoon lag naast hem. Doorzoek hem.</p>
   <div class="suspects">
    <div class="sus"><b>Lotte Aldering</b><span>31 · dochter, erfgenaam</span></div>
    <div class="sus"><b>Daan Verbeek</b><span>44 · compagnon</span></div>
    <div class="sus"><b>Mila Jansen</b><span>26 · assistent</span></div>
    <div class="sus"><b>Henk de Wit</b><span>67 · buurman, antiquair</span></div>
   </div></details>
  <section><h2>Opdrachten <span class="n">${Math.min(S.step-1,5)}/5</span></h2><ol class="tasks">${TASKS.map(taskHTML).join('')}</ol></section>
  <section><h2>Vastgepind bewijs <span class="n">${S.pins.length}</span></h2>${S.pins.length?`<ul class="pins">${S.pins.map((id,i)=>`<li><span class="tag">B-${String(i+1).padStart(2,'0')}</span><span class="txt">${esc(EV[id].l)}</span><button data-act="pin" data-id="${id}">los</button></li>`).join('')}</ul>`:`<p class="empty">Tik op 📌 bij berichten, foto’s en logregels om bewijs te verzamelen. Je hebt het nodig voor je eindrapport.</p>`}</section>
  <section><h2>Eindrapport</h2>${reportHTML()}</section>
  <div class="foot"><small>Fout antwoord −5 · hint −10. Je voortgang blijft bewaard in deze browser.</small><button class="linkbtn" data-act="reset">${resetArm?'Tik nogmaals om alles te wissen':'Zaak opnieuw beginnen'}</button></div>`;
  d.scrollTop=sc;
  document.getElementById('dbtnmeta').textContent=`${Math.min(S.step-1,5)}/5 · ${score()}`;
}

/* ======================= MODALS ======================= */
function renderModal(){
  const m=document.getElementById('modal');
  if(!S.started){
    m.innerHTML=`<div class="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="introt">
     <div class="case" style="font-family:var(--f-mono);color:var(--accent);font-size:12px;letter-spacing:.12em;font-weight:600">ZAAK #001 · RECHERCHE HAARLEM</div>
     <h2 id="introt">De Reiger</h2>
     <p>Een galeriehouder ligt dood onder aan zijn trap. Het lijkt een ongeluk, maar de patholoog denkt daar anders over.</p>
     <p>Het enige wat je hebt is <b>zijn telefoon</b>. Ontgrendel hem, lees zijn berichten, bekijk zijn foto’s en vind uit wie hem die avond als laatste zag.</p>
     <p style="color:var(--muted);font-size:14.5px">Speelduur ongeveer 15 minuten. Werk de opdrachten in het dossier af, pin bewijs vast met 📌 en dien aan het eind je beschuldiging in.</p>
     <button class="btn" data-act="start">Start onderzoek</button></div></div>`; return;}
  if(showResult&&S.report){
    const r=S.report, ok=v=>v?'✅':'❌';
    const stars=r.score>=90?'⭐⭐⭐':r.score>=70?'⭐⭐☆':r.score>0?'⭐☆☆':'☆☆☆';
    const share=`🔎 Zaak #001 · De Reiger\nWie ${ok(r.wie)} Hoe ${ok(r.hoe)} Waarom ${ok(r.waarom)}\n💡 ${r.hints} hint${r.hints===1?'':'s'} · ✖️ ${r.wrong} fout\n${stars} ${r.score} punten`;
    m.innerHTML=`<div class="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rest">
      <span class="stamp ${r.wie?'ok':''}">${r.wie?'Zaak opgelost':'Dader ontsnapt'}</span>
      <h2 id="rest">${r.wie?'Daan Verbeek is aangehouden':'Verkeerde verdachte'}</h2>
      <div class="verdict"><div>Wie<b>${ok(r.wie)}</b></div><div>Hoe<b>${ok(r.hoe)}</b></div><div>Waarom<b>${ok(r.waarom)}</b></div></div>
      <p style="font-family:var(--f-mono);font-size:14px">${stars} ${r.score} punten · onderbouwing ${3-r.bad}/3 sterk</p>
      <p><b>Wat er gebeurde.</b> Ruben had ontdekt dat Daan via de galerie vervalsingen verkocht. Om 22:00 kwam Daan naar de galerie voor een gesprek. Dat liep uit de hand en om 22:14 sloeg Daan hem met het bronzen beeldje De Reiger. Hij legde Ruben onder aan de trap zodat het op een val leek. Daarna hield hij de telefoon voor Rubens gezicht. Hij stuurde zichzelf een bericht alsof Ruben nog leefde, wiste de berichten over het rapport en de screenshot met zijn verkopen, en zette met de personeelscode het alarm aan.</p>
      <ol class="chain">
       <li>Rubens hartslag stopt om <b>22:14</b>.</li>
       <li>Om <b>22:21</b> wordt de telefoon met Face ID ontgrendeld, en om <b>22:22</b> “stuurt Ruben” een bericht. Ruben was toen al dood.</li>
       <li>Het alarm gaat om <b>22:29</b> aan met de code die alleen Daan en Mila kennen. Mila zat in Zandvoort.</li>
       <li>Op het camerabeeld staat een grijze stationwagen met kenteken “GV-2…”. Daan rijdt een grijze Volvo met <b>GV-218-K</b> en meldde om 21:47 dat hij in Raaks stond.</li>
       <li>Het motief staat in het rapport van Mertens en in Rubens mail aan Daan: Polderzicht is vals.</li>
      </ol>
      <p style="color:var(--muted);font-size:14.5px">Afleiders: Lotte had ruzie en geldnood, maar zat in Amsterdam. Mila verloor haar baan, maar zat in Zandvoort. Henk had burenruzie, maar kende de code niet.</p>
      <p style="font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Deel je resultaat (zonder spoilers)</p>
      <pre class="share" id="sharetxt">${share}</pre>
      <div class="row-btns"><button class="btn" data-act="copy">Kopieer resultaat</button><button class="btn ghost" data-act="closeresult">Sluiten</button></div>
     </div></div>`; return;}
  m.innerHTML='';
}

/* ======================= ACTIES ======================= */
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function render(){renderPhone();renderDossier();renderModal()}

function collectDraft(){
  const f=document.getElementById('reportform'); if(!f) return draft;
  const g=n=>(f.querySelector(`input[name="${n}"]:checked`)||{}).value;
  return {wie:g('wie'),hoe:g('hoe'),waarom:g('waarom'),bewijs:[...f.querySelectorAll('input[name="bewijs"]:checked')].map(i=>i.value)};
}
function checkAnswer(id,val){
  const t=TASKS.find(x=>x.id===id);
  let ok;
  if(t.type==='choice') ok=val===t.ans;
  else { if(!val||!val.trim()){fb[id]='Vul eerst een antwoord in.';renderDossier();return} ok=val.replace(/\D/g,'')===t.ans }
  if(ok){S.step=id+1;delete fb[id];save();toast('Goed! Opdracht '+id+' afgerond.');render();}
  else{S.wrong++;fb[id]=t.type==='choice'?'Nee, die kan het wel geweest zijn. Kijk nog eens waar beiden die avond waren. (−5)':'Dat klopt niet. Kijk nog eens goed. (−5)';save();renderDossier();
    const inp=document.getElementById('ans-'+id); if(inp){inp.value='';inp.focus()}}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(a!=='reset') resetArm=false;
  switch(a){
   case 'start': S.started=true; save(); render(); break;
   case 'digit':
     if(pinEntry.length>=4) break;
     pinEntry+=t.dataset.k; renderPhone();
     if(pinEntry.length===4){
       if(pinEntry==='1931'){setTimeout(()=>{pinEntry='';S.unlocked=true;if(S.step===1)S.step=2;save();toast('Telefoon ontgrendeld. Opdracht 1 afgerond.');render()},200)}
       else{setTimeout(()=>{const d=document.getElementById('dots');d&&d.classList.add('shake');setTimeout(()=>{pinEntry='';renderPhone()},420)},120)}
     } break;
   case 'del': pinEntry=pinEntry.slice(0,-1); renderPhone(); break;
   case 'open': S.stack=[{app:t.dataset.app}]; save(); renderPhone(); break;
   case 'chat': S.stack.push({app:'berichten',chat:id}); save(); renderPhone(); break;
   case 'mail': S.stack.push({app:'mail',mail:id}); save(); renderPhone(); break;
   case 'note': S.stack.push({app:'notities',note:id}); save(); renderPhone(); break;
   case 'album': S.stack.push({app:'fotos',album:id}); save(); renderPhone(); break;
   case 'sub': S.stack.push({app:'instellingen',sub:id}); save(); renderPhone(); break;
   case 'back': S.stack.pop(); save(); renderPhone(); break;
   case 'home': viewer=null; if(S.unlocked){S.stack=[];save()} renderPhone(); break;
   case 'photo': viewer=id; renderPhone(); break;
   case 'closeview': viewer=null; renderPhone(); break;
   case 'zoom': {
     const img=t.querySelector('.img'); const r=t.getBoundingClientRect();
     if(t.classList.toggle('z')){const ir=img.getBoundingClientRect();const ox=((e.clientX-ir.left)/ir.width*100).toFixed(1),oy=((e.clientY-ir.top)/ir.height*100).toFixed(1);img.style.transformOrigin=`${ox}% ${oy}%`;img.style.transform='scale(3.4)'}
     else img.style.transform='scale(1)';
     break;}
   case 'pin': {
     const i=S.pins.indexOf(id);
     if(i>=0){S.pins.splice(i,1);toast('Losgemaakt')} else {S.pins.push(id);toast('📌 Vastgepind: '+EV[id].l)}
     if(draft)draft=collectDraft();
     save(); renderPhone(); renderDossier(); break;}
   case 'memo': S.memo[id]=!S.memo[id]; save(); renderPhone(); break;
   case 'answer': {
     const task=TASKS.find(x=>x.id===+id);
     if(task.type==='choice') checkAnswer(+id,t.dataset.v);
     else checkAnswer(+id,(document.getElementById('ans-'+id)||{}).value);
     break;}
   case 'hint': if(!S.hints.includes(+id)){S.hints.push(+id);save()} renderDossier(); break;
   case 'armreport': {
     draft=collectDraft();
     if(!draft.wie||!draft.hoe||!draft.waarom){fb.report='Beantwoord wie, hoe en waarom.';renderDossier();break}
     if(draft.bewijs.length!==3){fb.report=`Kies precies 3 bewijzen (nu ${draft.bewijs.length}).`;renderDossier();break}
     delete fb.report; confirmArm=true; renderDossier(); break;}
   case 'cancelreport': draft=collectDraft(); confirmArm=false; renderDossier(); break;
   case 'submitreport': {
     const d=collectDraft(); const bad=d.bewijs.filter(x=>!EV[x].s).length;
     const r={wie:d.wie===SOLUTION.wie,hoe:d.hoe===SOLUTION.hoe,waarom:d.waarom===SOLUTION.waarom,bad,hints:S.hints.length,wrong:S.wrong};
     r.pen=(r.hoe?0:15)+(r.waarom?0:15)+5*bad;
     S.report=r; r.score=r.wie?Math.max(0,100-5*S.wrong-10*S.hints.length-r.pen):0;
     if(!r.wie) r.pen=100;
     confirmArm=false; draft=null; showResult=true; save(); render(); break;}
   case 'showresult': showResult=true; renderModal(); break;
   case 'closeresult': showResult=false; renderModal(); break;
   case 'copy': {
     const txt=document.getElementById('sharetxt').textContent;
     const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('sharetxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Tekst geselecteerd. Kopieer met je toetsenbord of menu.')};
     try{navigator.clipboard.writeText(txt).then(()=>toast('Resultaat gekopieerd'),sel)}catch(err){sel()}
     break;}
   case 'reset':
     if(!resetArm){resetArm=true;renderDossier();break}
     resetArm=false; S=fresh(); S.started=true; viewer=null; pinEntry=''; fb={}; draft=null; confirmArm=false; showResult=false; save(); render(); toast('Zaak opnieuw gestart'); break;
   case 'toggleD': document.body.classList.toggle('dopen'); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('ans-')){e.preventDefault();checkAnswer(+e.target.id.slice(4),e.target.value)}
  if(!S.unlocked&&S.started&&!viewer&&/^[0-9]$/.test(e.key)&&!(e.target.matches&&e.target.matches('input'))){const b=document.querySelector(`[data-act="digit"][data-k="${e.key}"]`);b&&b.click()}
  if(e.key==='Escape'){if(viewer){viewer=null;renderPhone()}else if(showResult){showResult=false;renderModal()}}
});
document.addEventListener('change',e=>{if(e.target.closest('#reportform')){draft=collectDraft();if(confirmArm){confirmArm=false;renderDossier()}}});

render();
})();
</script>

</body>
</html>
