<title>Hoogwater</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Jost:wght@300;400;500&family=Caveat:wght@500;600&display=swap">
<style>
/* Nachtgalerie: een donkere museumzaal na sluitingstijd. De telefoon staat als object op een sokkel onder één spot; het dossier hangt als zaaltekst aan de wand. Eén kleur verzadigd: de rode "verkocht"-stip = verdacht. */
:root{
  --wall:#161D1A; --wall-hi:#1F2824; --wall-lo:#0D1210;
  --ink:#E4DFD3; --muted:#A3A69C; --line:#33403A;
  --plaster:#E7E3DA; --label:#EFEBE3; --label-ink:#171C19; --label-mute:#5A5F58; --label-line:#D2CCBF;
  --light:#F5DDAA; --dot:#C8261C; --err:#F2907F; --ok:#9CC7A2;
  --f-display:"Jost","Futura","Century Gothic","Avenir Next",sans-serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:var(--f-body);
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --bg:var(--wall); --panel:var(--wall); --accent:var(--light); --stamp:var(--dot);
  color-scheme:dark;
}
::selection{background:rgba(245,221,170,.32);color:#fff}
html,body{height:100%}
body{background:radial-gradient(ellipse 90% 70% at 35% -10%,var(--wall-hi),var(--wall) 55%,var(--wall-lo)) fixed,var(--wall);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;caret-color:var(--light);scrollbar-color:var(--line) transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--light);outline-offset:3px}

.layout{min-height:100%;display:grid;grid-template-columns:390px minmax(0,440px);gap:72px;justify-content:center;align-items:start;
  padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Telefoon (eigen, vaste look: dit is een apparaat) ---------- */
.phone{width:390px;max-width:100%;height:min(812px,calc(100dvh - 56px));min-height:520px;background:#0b0b0d;border-radius:52px;padding:12px;
  box-shadow:0 0 0 1.5px #2e3330,0 40px 70px -30px rgba(0,0,0,.9),0 0 90px -20px rgba(245,221,170,.10);position:sticky;top:28px;transform-origin:50% 100%;transition:transform 1.25s cubic-bezier(.16,1,.3,1),box-shadow 1.25s ease,height 1.25s cubic-bezier(.16,1,.3,1)}
.screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#f2f2f7;color:#111;font-family:var(--f-ui);font-size:15px;line-height:1.35;display:flex;flex-direction:column;container-type:size}
.sbar{position:absolute;inset:0 0 auto;height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px 0 30px;font-weight:600;font-size:14px;z-index:5;pointer-events:none}
.sbar .r{display:flex;align-items:center;gap:5px;font-size:12.5px}
.sbar svg{display:block}
.sbar.light{color:#fff}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#000;z-index:6}
.homebar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:rgba(0,0,0,.75);border:0;padding:0;z-index:8}
.homebar.light{background:rgba(255,255,255,.85)}
.homebar::after{content:"";position:absolute;inset:-10px -10px}

/* vergrendelscherm */
.lock{position:absolute;inset:0;color:#fff;display:flex;flex-direction:column;align-items:center}
.lock .wall{position:absolute;inset:0}
.lock .wall svg{width:100%;height:100%;display:block}
.lock .veil{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,0) 40%,rgba(0,0,0,.55))}
.lock>*:not(.wall):not(.veil){position:relative}
.ldate{margin-top:clamp(44px,7.5cqh,62px);font-size:17px;font-weight:500;opacity:.9}
.ltime{font-size:clamp(54px,10.5cqh,84px);font-weight:600;letter-spacing:-2px;line-height:1}
.notifs{width:calc(100% - 24px);display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:clamp(10px,2cqh,18px)}
.notif{background:rgba(245,245,250,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#111;border-radius:18px;padding:10px 14px;font-size:14px;min-width:0}
.notif b{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.notif b small{font-weight:400;color:#444;flex:none}
.notif p{margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lockbottom{margin-top:auto;margin-bottom:clamp(16px,3.2cqh,26px);width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.dots{display:flex;gap:14px;margin-bottom:4px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.dots i.f{background:#fff}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pad{--k:clamp(50px,8.4cqh,64px);display:grid;grid-template-columns:repeat(3,var(--k));gap:clamp(8px,1.5cqh,12px) 22px}
.pad button{width:var(--k);height:var(--k);border-radius:50%;border:0;background:rgba(28,30,32,.42);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);color:#fff;font-size:26px;font-family:var(--f-ui);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pad button.txt{background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;font-size:15px}
.lockhint{font-size:13px;display:flex;gap:10px;align-items:center;background:rgba(20,22,24,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:4px 4px 4px 14px}
@container (max-height:700px){.notif:nth-child(2){display:none}}
@container (max-height:600px){.notifs{display:none}}
@container (max-height:470px){.ldate{display:none}.ltime{font-size:44px;margin-top:40px}.pad{--k:44px;gap:6px 22px}.lockbottom{gap:6px;margin-bottom:12px}.pad button{font-size:22px}}
.pinmsg{font-size:12.5px;min-height:17px;margin-top:-6px;text-align:center;padding:0 24px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.lockhint button.nudge{background:#fff;color:#111;box-shadow:0 0 0 4px rgba(255,255,255,.28)}
.lockhint button{border:0;background:rgba(255,255,255,.26);color:#fff;border-radius:16px;padding:7px 12px;font-size:12.5px;font-family:var(--f-ui)}

/* beginscherm */
.home{position:absolute;inset:0;background:linear-gradient(160deg,#25324a,#0e1626 55%,#3b2a1a);padding:64px 18px 0;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.tip{background:rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.4;margin-bottom:22px;display:grid;gap:8px}
.tip .pin{pointer-events:none}
.tip button.ok{justify-self:start;border:0;background:#fff;color:#111;border-radius:14px;padding:6px 14px;font:600 13px var(--f-ui)}
.ico{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font-size:11.5px;font-family:var(--f-ui)}
.ico span.i{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;font-size:29px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ico .badge{position:absolute;top:-6px;right:-6px;background:#ff3b30;color:#fff;font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 5px}
.cal{background:#fff;color:#111;flex-direction:column;line-height:1}
.cal small{color:#ff3b30;font-size:10px;font-weight:600}
.cal b{font-size:26px;font-weight:400}

/* apps */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:#f2f2f7}
.ah{padding:50px 12px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(249,249,251,.95);border-bottom:1px solid #d9d9de;min-height:92px}
.ah .back{border:0;background:none;color:#0a7aff;font-size:16px;justify-self:start;padding:6px 4px 6px 0;font-family:var(--f-ui);display:inline-flex;align-items:center;gap:1px}
.ah b{font-size:16px;text-align:center}
.ah .big{grid-column:1/-1;font-size:30px;font-weight:700;padding:2px 6px 0}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:30px}
.list{background:#fff;margin:14px 14px 0;border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid #e7e7ec;font-family:var(--f-ui);font-size:15px;color:#111}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .sub{color:#6b6b72;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:#6c6c72;font-size:13px;white-space:nowrap}
.row .chev{color:#c4c4c8;display:grid}
.icn{display:block;flex:none}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.unread{width:9px;height:9px;border-radius:50%;background:#0a7aff;flex:none}
.sect{margin:18px 28px 6px;color:#6b6b72;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.note{margin:8px 28px;color:#6c6c72;font-size:12.5px}

/* chat */
.chat{padding:10px 12px 30px;display:flex;flex-direction:column;gap:4px;background:#fff;min-height:100%}
.day{align-self:center;color:#6c6c72;font-size:12px;margin:12px 0 4px}
.msg{max-width:84%;display:flex;align-items:flex-end;gap:6px}
.msg .bub{min-width:0}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:8px 12px;border-radius:18px;background:#e9e9eb;color:#111;font-size:15px;position:relative}
.msg.me .bub{background:#0a7aff;color:#fff}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.bub .who{display:block;font-size:11.5px;font-weight:600;color:#7a4fd0;margin-bottom:1px}
.bub.del{background:none;border:1px solid #d0d0d5;color:#6c6c72;font-style:italic}
.msg.me .bub.del{background:none;color:#6c6c72}

/* vastpinnen */
.pin{position:relative;display:inline-flex;align-items:center;gap:3px;flex:none;border:1px solid #c7c7cc;background:#fff;color:#3a3a3c;border-radius:14px;padding:3px 9px 3px 6px;font:600 12px/1.25 var(--f-ui);white-space:nowrap;vertical-align:middle}
.pin::after{content:"";position:absolute;inset:-9px -5px}
.pin:hover{border-color:#8a8a8f}
.pin.on{background:#fff;border-color:#C8261C;color:#8E1A13}
.pin .pi{width:9px;height:9px;border-radius:50%;border:1.5px solid #8a8a8f;box-sizing:border-box;flex:none}
.pin.on .pi{background:#C8261C;border-color:#C8261C}

/* mail */
.mailv{background:#fff;min-height:100%;padding:16px 18px 30px}
.mailv h3{margin:0 0 10px;font-size:20px}
.mailv .from{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:14px}
.mailv .from small{color:#6c6c72;display:block}
.mailv p{margin:0 0 12px;font-size:15.5px;line-height:1.45}
.attach{border:1px solid #e0e0e5;border-radius:12px;padding:12px 14px;background:#fafafc;font-size:14px}
.attach h4{margin:0 0 6px;font-size:14px}
.status{color:#2b8a3e;font-size:13px;margin-top:6px}

/* foto's */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#fff}
.pgrid button{border:0;padding:0;aspect-ratio:1;overflow:hidden;background:#ddd;display:block}
.pgrid svg{width:100%;height:100%;display:block}
.viewer{position:absolute;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;color:#fff}
.viewer .vh{padding:50px 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.viewer .vh button{border:0;background:none;color:#4da3ff;font-size:16px;font-family:var(--f-ui)}
.viewer .vh div{text-align:center;font-size:13px;line-height:1.3}
.viewer .vh small{color:#aaa}
.zoomwrap{flex:1;overflow:hidden;display:grid;place-items:center;cursor:zoom-in;touch-action:manipulation}
.zoomwrap.z{cursor:zoom-out}
.zoomwrap .img{width:100%;transition:transform .3s ease}
.zoomwrap .img svg{width:100%;height:auto;display:block}
.vfoot{padding:10px 16px 28px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#ccc;gap:10px}
.vfoot .pin{background:#1c1c1e;border-color:#555;color:#fff;font-size:13px;padding:6px 12px 6px 9px}
.vfoot .pin.on{background:#fff;border-color:#C8261C;color:#8E1A13}
.vfoot .pin .pi{border-color:#aaa}

/* overige app-onderdelen */
.card{background:#fff;margin:14px;border-radius:14px;padding:14px}
.card h4{margin:0 0 4px;font-size:15px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee;font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv .t{font-variant-numeric:tabular-nums;color:#6b6b72;font-size:13.5px;flex:none;width:44px}
.kv .grow{flex:1;min-width:0}
.warn{color:#d70015}
.thumb{width:64px;height:40px;border-radius:6px;overflow:hidden;border:0;padding:0;flex:none}
.thumb svg{width:100%;height:100%;display:block}
.memo{display:flex;gap:12px;align-items:flex-start}
.play{width:36px;height:36px;border-radius:50%;border:0;background:#ff3b30;color:#fff;flex:none;display:grid;place-items:center}
.transcript{margin-top:8px;font-size:14px;color:#333;background:#f5f5f7;border-radius:10px;padding:8px 10px;font-style:italic}
.post{background:#fff;margin-bottom:10px}
.post .ph{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px;font-weight:600}
.post .ph small{font-weight:400;color:#6c6c72;margin-left:auto}
.post .pimg{border:0;padding:0;width:100%;display:block;background:#000}
.post .pimg svg{width:100%;display:block}
.post .cap{padding:8px 12px 12px;font-size:14px;display:flex;gap:6px;align-items:flex-start}
.post .cap span{flex:1}
.ring{padding:2px;border-radius:50%;background:linear-gradient(45deg,#f9a13a,#e1306c,#8a3ab9)}
.ring .av{border:2px solid #fff;width:36px;height:36px;font-size:13px}

/* ---------- Zaal: spot, sokkel, opening ---------- */
.stage{position:relative;display:flex;flex-direction:column;align-items:center}
.stage::before{content:"";position:absolute;left:50%;top:-40px;width:min(820px,100vw);height:calc(100% + 80px);transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(ellipse 44% 60% at 50% 42%,rgba(245,221,170,.16),rgba(245,221,170,.05) 55%,transparent 74%);opacity:1;transition:opacity 1.4s ease}
body.intro .stage::before{opacity:1;background:radial-gradient(ellipse 34% 62% at 50% 62%,rgba(245,221,170,.30),rgba(245,221,170,.08) 50%,transparent 72%)}
body.intro .layout{align-items:center;min-height:100dvh}
body.intro .layout,body.lifting .layout{grid-template-areas:"stage top" "stage rest";grid-template-rows:auto auto;align-content:center;row-gap:20px}
body.intro .stage,body.lifting .stage{grid-area:stage;align-self:center}
body.intro #intro,body.lifting #intro{grid-area:top;align-self:end}
body.intro #intro2,body.lifting #intro2{grid-area:rest;align-self:start}
.opening .go-m{display:none}
body.intro .phone{height:min(600px,calc(100dvh - 300px));min-height:420px;transform:perspective(1500px) rotateX(64deg) scale(.8);box-shadow:0 0 0 1.5px #2e3330,0 60px 50px -10px rgba(0,0,0,.75)}
.plinth{display:none;width:min(470px,100%);position:relative;margin-top:-96px;z-index:-1}
.plinth i{display:block;height:92px;background:radial-gradient(ellipse 37% 34% at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,.18) 60%,transparent 78%),linear-gradient(#F4F1EB,#D8D2C5);clip-path:polygon(11% 0,89% 0,100% 100%,0 100%)}
.plinth b{display:block;height:min(170px,18dvh);background:linear-gradient(90deg,#C9C3B7,#E7E3DA 30%,#E7E3DA 70%,#BDB7AB);box-shadow:0 30px 40px -20px rgba(0,0,0,.8)}
body.intro .plinth,body.lifting .plinth{display:block}
body.lifting .plinth{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.16,1,.3,1)}
.off{position:absolute;inset:0;background:linear-gradient(160deg,#23272a 0%,#07090a 38%,#0b0d0e 100%)}
.off::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 42%,transparent 52%)}
.screen.waking{animation:wake 1.1s cubic-bezier(.16,1,.3,1)}
@keyframes wake{from{filter:brightness(.15)}to{filter:none}}

.opening{display:none;align-self:center;max-width:440px;gap:20px;color:var(--ink)}
body.intro .opening,body.lifting .opening{display:grid}
body.lifting .opening{opacity:0;transform:translateY(-8px);transition:opacity .7s ease,transform .9s ease}
.vinyl{font-family:var(--f-display);font-weight:300;font-size:clamp(60px,7.4vw,92px);line-height:.88;letter-spacing:-.025em;margin:0;text-wrap:balance}
.objlabel{background:var(--label);color:var(--label-ink);padding:14px 16px 13px;font-size:13.5px;line-height:1.5;max-width:330px;box-shadow:0 14px 30px -16px rgba(0,0,0,.9)}
.objlabel b{display:block;font-size:15px;font-weight:700;margin-bottom:2px}
.objlabel span{display:block;color:var(--label-mute)}
.lead{font-size:18px;line-height:1.5;margin:0;max-width:38ch}
.moves{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:m;max-width:40ch}
.moves li{display:grid;grid-template-columns:26px 1fr;font-size:15px;line-height:1.45;color:var(--muted)}
.moves li::before{counter-increment:m;content:counter(m);font-family:var(--f-display);font-size:17px;color:var(--ink);line-height:1.3}
.moves b{color:var(--ink);font-weight:600}
.cw{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:0;max-width:44ch}
.cw b{color:var(--ink);font-weight:600}
.go{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.go small{color:var(--muted);font-size:13px}

/* ---------- Dossier: zaaltekst aan de wand ---------- */
.dossier{display:flex;flex-direction:column;gap:30px;min-width:0;padding:6px 0 18px;color:var(--ink)}
body.intro .dossier,body.lifting .dossier{display:none}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px}
.dh h1{font-family:var(--f-display);font-weight:300;font-size:54px;line-height:.9;letter-spacing:-.02em;margin:0}
.case{font-size:13px;color:var(--muted);margin-top:10px}
.score{text-align:right;font-variant-numeric:tabular-nums}
.score span{font-family:var(--f-display);font-weight:400;font-size:36px;display:block;line-height:1}
.score small{color:var(--muted);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
.dossier h2,details.brief summary{font-family:var(--f-body);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;gap:10px;align-items:center}
.dossier h2 .n{font-weight:500;letter-spacing:.04em;color:var(--ink)}
details.brief summary{cursor:pointer;list-style:none;justify-content:space-between;margin:0}
details.brief summary::-webkit-details-marker{display:none}
details.brief summary::after{content:"";width:12px;height:12px;flex:none;background:linear-gradient(currentColor,currentColor) center/12px 1.5px no-repeat,linear-gradient(currentColor,currentColor) center/1.5px 12px no-repeat}
details.brief[open] summary::after{background:linear-gradient(currentColor,currentColor) center/12px 1.5px no-repeat}
.brief p{margin:12px 0 0;max-width:62ch;font-size:15.5px}
.facts{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:15px;line-height:1.45;color:var(--muted);max-width:62ch}
.facts b{color:var(--ink);font-weight:600}
.suspects{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:14px;background:var(--line);border-block:1px solid var(--line)}
.sus{background:var(--wall);padding:10px 12px 10px 0;font-size:13.5px;line-height:1.35}
.sus:nth-child(even){padding-left:12px}
.sus b{display:block;font-size:15px;font-weight:600}
.sus span{color:var(--muted)}

}

function taskHTML(t){

  let h=`<li class="task ${cls}"><span class="num">${done?ic('check',18,2.2):t.id}</span><p class="q">${active||done?t.q:'Vergrendeld'}</p>`;
  if(done) h+=`<p class="res">${t.done}</p>`;
  if(active){
    if(t.type==='auto') h+=`<p class="res">Vind de pincode van vier cijfers en voer die in op de telefoon.</p>`;
    else if(t.type==='multi') h+=`<div class="act multi" role="group" aria-label="Kies alle juiste">${t.opts.map(o=>`<label class="opt"><input type="checkbox" name="m-${t.id}" value="${o[0]}" ${(msel[t.id]||[]).includes(o[0])?'checked':''}>${o[1]}</label>`).join('')}<button class="btn" data-act="answer" data-id="${t.id}">Controleer</button></div>`;
    else if(t.type==='choice') h+=`<div class="act choice">${t.opts.map(o=>`<button class="btn ghost" data-act="answer" data-id="${t.id}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>`;
    else h+=`<div class="act"><input id="ans-${t.id}" inputmode="numeric" autocomplete="off" placeholder="${t.ph}" aria-label="Antwoord opdracht ${t.id}"><button class="btn" data-act="answer" data-id="${t.id}">Controleer</button></div>`;

    <div class="sus"><b>Joris de Kok</b><span>52 · wethouder, verantwoordelijk voor de kustversterking.</span></div>
   </div></details>
  <div class="foot"><small>Fout antwoord −5 · hint −10. Je voortgang blijft bewaard in deze browser.</small><button class="linkbtn" data-act="reset">${resetArm?'Tik nogmaals om alles te wissen':'Zaak opnieuw beginnen'}</button></div>`;
  d.scrollTop=sc;
  document.getElementById('dbtnmeta').textContent=`${Math.min(S.step-1,5)}/5 · ${score()}`;
  const tb=document.getElementById('taskbar'), cur=TASKS.find(t=>t.id===S.step);
  const go='<span class="go">'+ic('chevr',16)+'</span>';
  tb.innerHTML=S.report?'<span class="k">Afgesloten</span><span class="q">Bekijk je uitslag in het dossier</span>'+go
    :cur?`<span class="k">${cur.id}/5</span><span class="q">${esc(cur.q)}</span>`+go
    :'<span class="k">Rapport</span><span class="q">Dien je beschuldiging in</span>'+go;
}

/* ======================= MODALS ======================= */
function renderModal(){
  const m=document.getElementById('modal');

  if(showResult&&S.report){
    const r=S.report, ok=v=>v?'✅':'❌', said=v=>`<i class="vd ${v?'on':''}" aria-hidden="true"></i>${v?'juist':'onjuist'}`;
    const parts=[r.wie,r.hoe,r.waarom].filter(Boolean).length;
    const plain=v=>v?'juist':'onjuist';
    const shown=`Zaak #002 · Hoogwater\nWie ${plain(r.wie)} · Hoe ${plain(r.hoe)} · Waarom ${plain(r.waarom)}\n${r.hints} hint${r.hints===1?'':'s'} · ${r.wrong} fout\n${r.score} punten`;
    shareText=`🌊 Zaak #002 · Hoogwater\nWie ${ok(r.wie)} Hoe ${ok(r.hoe)} Waarom ${ok(r.waarom)}\n💡 ${r.hints} hint${r.hints===1?'':'s'} · ✖️ ${r.wrong} fout\n${r.score} punten`;
    document.getElementById('toast').hidden=true;
    m.innerHTML=`<div class="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rest">
      <h2 id="rest" class="vh ${r.wie?'ok':''}">${r.wie?'Mark Visser is aangehouden':'Verkeerde verdachte'}</h2>
      <div class="verdict"><div>Wie<b>${said(r.wie)}</b></div><div>Hoe<b>${said(r.hoe)}</b></div><div>Waarom<b>${said(r.waarom)}</b></div></div>
      <p class="tally"><b>${r.score}</b> punten · ${parts} van 3 onderdelen juist · onderbouwing ${3-r.bad} van 3 sterk</p>
      <p><b>Wat er gebeurde.</b> Mark Visser liet het waterschap via zijn bedrijf 1,3 miljoen euro betalen voor zand dat nooit is gestort. Noor ontdekte het en wilde zijn reactie horen voordat het in de krant stond. Hij liet haar naar de parkeerplaats bij de Nolledijk komen. Om 22:44 stapte ze bij hem in de auto. Het gesprek liep uit de hand; om 22:53 probeerde Noor nog 112 te bellen. Mark sleurde haar de dijk af en hield haar in het hoogwater vast. Daarna legde hij haar telefoon in haar eigen auto. Om 23:51 ontgrendelde hij hem met de code die hij nog kende, stuurde Sanne een afscheidsbericht en wiste om 23:53 hun gesprek.</p>
      <ol class="chain">
       <li>Het afscheidsbericht van <b>23:52</b> is getikt na een ontgrendeling met de <b>toegangscode</b>. Noor gebruikte altijd Face ID, en dat werkt bij haar alleen met open ogen.</li>
       <li>Noor schrijft altijd “mam”. Het afscheidsbericht zegt “<b>mama</b>”.</li>
       <li>Om <b>22:53</b> belde Noor 112. Dat doet niemand die van plan is de zee in te lopen.</li>
       <li>Van <b>22:44 tot 22:51</b> was haar telefoon verbonden met <b>HILUX-VISSER</b>, de bedrijfsauto van Mark.</li>
       <li>Noors notitie: “Mark kent hem nog.” Alleen hij kon de code intikken.</li>
       <li>In Recent verwijderd staat het gesprek: Noor confronteerde hem met de facturen, hij koos de plek en de tijd.</li>
      </ol>
      <p style="color:var(--muted);font-size:14.5px">Afleiders: Joris de Kok dreigde met juridische stappen, maar zat tot laat in de raadsvergadering. Eline wist van de afspraak, maar zat thuis met haar zieke zoon. Sanne had ruzie met Noor over hun moeder, maar was thuis in Middelburg. Thijs was alleen een date.</p>
      <p class="lbl">Deel je resultaat (zonder spoilers)</p>
      <pre class="share" id="sharetxt">${shown}</pre>
      <div class="row-btns"><button class="btn" data-act="copy">Kopieer resultaat</button><button class="btn ghost" data-act="closeresult">Sluiten</button></div>
     </div></div>`; return;}
  m.innerHTML='';
}

/* ======================= ACTIES ======================= */
let toastT;
function toast(msg,dot){const t=document.getElementById('toast');if(showResult)return;t.innerHTML=(dot?'<span class="tdot" aria-hidden="true"></span>':'')+esc(msg);t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function renderIntro(){
  const el=document.getElementById('intro'), el2=document.getElementById('intro2');
  if(S.started){el.innerHTML='';el2.innerHTML='';return}
  const go=cls=>`<div class="go ${cls}"><button class="btn" data-act="start">Pak de telefoon</button><small>± 20 minuten · je voortgang wordt bewaard</small></div>`;
  el.innerHTML=`<h1 class="vinyl" id="introt">Hoogwater</h1>
   <div class="objlabel"><b>Telefoon, zilver</b>Gevonden op de passagiersstoel van de auto van Noor Vermeulen (36), journalist.<span>Parkeerplaats Nolledijk, Vlissingen · donderdag 4 december, 06:50</span><span>Collectie Recherche Zeeland · zaak #002</span></div>
   ${go('go-m')}`;
  el2.innerHTML=`<p class="lead">Op het scherm staat een afscheidsbericht aan haar zus. Iedereen denkt aan zelfmoord. De blauwe plekken op haar armen zeggen iets anders.</p>
   <ol class="moves">
     <li><span><b>Doorzoek de telefoon.</b> Ook wat gewist is, is soms nog te vinden.</span></li>
     <li><span><b>Pin wat verdacht is.</b> Je hebt drie bewijzen nodig voor je beschuldiging.</span></li>
     <li><span><b>Volg het dossier.</b> Vijf vragen leiden je naar de dader. Hints kosten punten.</span></li>
   </ol>
   <p class="cw"><b>Inhoud:</b> moord door verdrinking, een in scène gezette zelfmoord. Geen expliciete beelden. Loop je zelf met gedachten aan zelfdoding? Praat erover met 113 Zelfmoordpreventie: bel 113 of 0800-0113 (gratis), of chat op 113.nl. In België: Zelfmoordlijn 1813.</p>
   ${go('go-d')}`;
}
function render(){
  document.body.classList.toggle('intro',!S.started&&!document.body.classList.contains('lifting'));
  renderIntro();renderPhone();renderDossier();renderModal();
}

function collectDraft(){
  const f=document.getElementById('reportform'); if(!f) return draft;
  const g=n=>(f.querySelector(`input[name="${n}"]:checked`)||{}).value;
  return {wie:g('wie'),hoe:g('hoe'),waarom:g('waarom'),bewijs:[...f.querySelectorAll('input[name="bewijs"]:checked')].map(i=>i.value)};
}
function checkAnswer(id,val){
  const t=TASKS.find(x=>x.id===id);
  let ok;
  if(t.type==='choice') ok=val===t.ans;
  else if(t.type==='multi'){ msel[id]=val; if(!val.length){fb[id]='Kies eerst wie de code kenden.';renderDossier();return} ok=val.slice().sort().join(',')===t.ans }
  else { if(!val||!val.trim()){fb[id]='Vul eerst een antwoord in.';renderDossier();return} ok=val.replace(/\D/g,'')===t.ans }
  if(ok){S.step=id+1;delete fb[id];save();toast(id===5?'Goed. Je eindrapport staat open.':'Goed. Opdracht '+(id+1)+' staat klaar.');render();}
  else{S.wrong++;fb[id]=t.type==='choice'?'Daar was ze niet. Zoek een spoor met tijd en plaats. (−5)':t.type==='multi'?'Dat klopt niet helemaal. Wie zaten er in het gesprek waar de code gedeeld werd? (−5)':'Dat klopt niet. Kijk nog eens goed. (−5)';save();renderDossier();
    const inp=document.getElementById('ans-'+id); if(inp){inp.value='';inp.focus()}}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(a!=='reset') resetArm=false;
  switch(a){
   case 'start': {
     if(document.body.classList.contains('lifting')) break;
     const wake=()=>{S.started=true;save();document.body.classList.remove('lifting');render();
       const sc=document.getElementById('screen');sc.classList.add('waking');setTimeout(()=>sc.classList.remove('waking'),1200);
       const first=document.querySelector('[data-k="1"]');first&&first.focus({preventScroll:true})};
     document.body.classList.add('lifting');document.body.classList.remove('intro');
     if(matchMedia('(prefers-reduced-motion: reduce)').matches) wake(); else setTimeout(wake,1150);
     break;}
   case 'digit':
     if(pinEntry.length>=4) break;
     pinEntry+=t.dataset.k; renderPhone();
     if(pinEntry.length===4){
       if(pinEntry==='1410'){setTimeout(()=>{pinEntry='';S.unlocked=true;if(S.step===1)S.step=2;save();toast('Ontgrendeld. Volgende vraag staat in het dossier.');render()},200)}
       else{pinFails++;setTimeout(()=>{const d=document.getElementById('dots');d&&d.classList.add('shake');setTimeout(()=>{pinEntry='';renderPhone()},420)},120)}
     } break;
   case 'del': pinEntry=pinEntry.slice(0,-1); renderPhone(); break;
   case 'open': S.stack=[{app:t.dataset.app}]; save(); renderPhone(); break;
   case 'chat': S.stack.push({app:'berichten',chat:id}); save(); renderPhone(); break;
   case 'mail': S.stack.push({app:'mail',mail:id}); save(); renderPhone(); break;
   case 'note': S.stack.push({app:'notities',note:id}); save(); renderPhone(); break;
   case 'album': S.stack.push({app:'fotos',album:id}); save(); renderPhone(); break;
   case 'sub': S.stack.push({app:(S.stack[S.stack.length-1]||{}).app||'instellingen',sub:id}); save(); renderPhone(); break;
   case 'back': S.stack.pop(); save(); renderPhone(); break;
   case 'home': viewer=null; if(S.unlocked){S.stack=[];save()} renderPhone(); break;
   case 'photo': viewer=id; renderPhone(); break;
   case 'closeview': viewer=null; renderPhone(); break;
   case 'zoom': {
     const img=t.querySelector('.img'); const r=t.getBoundingClientRect();
     if(t.classList.toggle('z')){const ir=img.getBoundingClientRect();const ox=((e.clientX-ir.left)/ir.width*100).toFixed(1),oy=((e.clientY-ir.top)/ir.height*100).toFixed(1);img.style.transformOrigin=`${ox}% ${oy}%`;img.style.transform='scale(3.4)'}
     else img.style.transform='scale(1)';
     break;}
   case 'pin': {
     const i=S.pins.indexOf(id);
     if(i>=0){S.pins.splice(i,1);toast('Losgemaakt')} else {S.pins.push(id);S.tipPin=true;toast('Vastgepind: '+EV[id].l,true)}
     if(draft)draft=collectDraft();
     save(); renderPhone(); renderDossier(); break;}
   case 'memo': S.memo[id]=!S.memo[id]; save(); renderPhone(); break;
   case 'tipok': S.tipPin=true; save(); renderPhone(); break;
   case 'answer': {
     const task=TASKS.find(x=>x.id===+id);
     if(task.type==='choice') checkAnswer(+id,t.dataset.v);
     else if(task.type==='multi') checkAnswer(+id,[...document.querySelectorAll(`input[name="m-${id}"]:checked`)].map(i=>i.value));
     else checkAnswer(+id,(document.getElementById('ans-'+id)||{}).value);
     break;}
   case 'hint': if(!S.hints.includes(+id)){S.hints.push(+id);save()} renderDossier(); break;
   case 'armreport': {
     draft=collectDraft();
     if(!draft.wie||!draft.hoe||!draft.waarom){fb.report='Beantwoord wie, hoe en waarom.';renderDossier();break}
     if(draft.bewijs.length!==3){fb.report=`Kies precies 3 bewijzen (nu ${draft.bewijs.length}).`;renderDossier();break}
     delete fb.report; confirmArm=true; renderDossier(); break;}
   case 'cancelreport': draft=collectDraft(); confirmArm=false; renderDossier(); break;
   case 'submitreport': {
     const d=collectDraft(); const bad=d.bewijs.filter(x=>!EV[x].s).length;
     const r={wie:d.wie===SOLUTION.wie,hoe:d.hoe===SOLUTION.hoe,waarom:d.waarom===SOLUTION.waarom,bad,hints:S.hints.length,wrong:S.wrong};
     r.pen=(r.hoe?0:15)+(r.waarom?0:15)+5*bad;
     S.report=r; r.score=r.wie?Math.max(0,100-5*S.wrong-10*S.hints.length-r.pen):0;
     if(!r.wie) r.pen=100;
     confirmArm=false; draft=null; showResult=true; save(); render(); break;}
   case 'showresult': showResult=true; renderModal(); break;
   case 'closeresult': showResult=false; renderModal(); break;
   case 'copy': {
     const txt=shareText||document.getElementById('sharetxt').textContent;
     const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('sharetxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Tekst geselecteerd. Kopieer met je toetsenbord of menu.')};
     try{navigator.clipboard.writeText(txt).then(()=>toast('Resultaat gekopieerd'),sel)}catch(err){sel()}
     break;}
   case 'reset':
     if(!resetArm){resetArm=true;renderDossier();break}
     resetArm=false; S=fresh(); S.started=true; viewer=null; pinEntry=''; fb={}; draft=null; confirmArm=false; showResult=false; save(); render(); toast('Zaak opnieuw gestart'); break;
   case 'toggleD': document.body.classList.toggle('dopen'); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('ans-')){e.preventDefault();checkAnswer(+e.target.id.slice(4),e.target.value)}
  if(!S.unlocked&&S.started&&!viewer&&/^[0-9]$/.test(e.key)&&!(e.target.matches&&e.target.matches('input'))){const b=document.querySelector(`[data-act="digit"][data-k="${e.key}"]`);b&&b.click()}
  if(e.key==='Escape'){if(viewer){viewer=null;renderPhone()}else if(showResult){showResult=false;renderModal()}}
});
document.addEventListener('change',e=>{if(e.target.closest('#reportform')){draft=collectDraft();if(confirmArm){confirmArm=false;renderDossier()}}});

render();
})();
</script>
